[project]
name = "manga-translation-backend"
version = "0.1.0"
description = "Local AI-powered manga translation backend"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.119.0",
    "numpy>=2.3.3",
    "pillow>=11.3.0",
    "pydantic>=2.12.2",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.37.0",
    # Local AI pipeline
    "opencv-python>=4.8.0", # Required by ultralytics
    "ultralytics>=8.3.0", # YOLOv10 detection
    "transformers>=4.60", # Model loading for manga-ocr and translation
    "accelerate>=0.30.0", # Model loading optimization
    "onnxruntime-gpu>=1.24.0", # GPU ONNX Runtime; 1.24+ is the first with Blackwell sm_120 cubins (CUDA 13). Runs CTD/PARSeq/LaMa on CUDA (LaMa ~50ms/forward vs ~2-4s CPU). Do NOT also install CPU `onnxruntime` (silent CPU fallback).
    "optimum>=1.19.0", # only the non-default manga-ocr backend (lazy import); PARSeq default uses raw onnxruntime-gpu (declared above). No [onnxruntime-gpu] extra — its transformers/ort pins conflict with transformers>=4.60 + numpy>=2.3.3.
    "huggingface-hub>=0.23.0", # Model downloads
    "torch>=2.0.0", # PyTorch backend
    "jinja2>=3.1.0", # HTML templating
    "einops>=0.8.1",
    "orjson>=3.10.0", # Fast JSON parsing (3-6x faster than stdlib)
    "sentencepiece>=0.1.99", # Required for LLaMA tokenizers
    "protobuf>=4.0.0", # Required for tokenizer serialization
    "streaming-form-data>=1.14.0", # Fast streaming multipart parser
    "sacrebleu",
    "sentence-transformers",
    "loguru",
    "pytest",
    # SFT / fine-tuning stack (unsloth, trl, peft, bitsandbytes, xformers, …)
    # lives in requirements-training.txt and installs into a SEPARATE venv.
    # unsloth's transitive pins can't co-resolve with transformers>=4.60 in a
    # single lock; app/ never imports it. Same pattern as unbabel-comet.
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
