model:
  name_or_path: Qwen/Qwen3-4B-Base
  dtype: bfloat16
  max_seq_length: 2048
  load_in_4bit: false

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  bias: none

data:
  train_path: backend/training/runs/manga-bubbles/data.parquet
  dev_path: backend/training/runs/manga-bubbles/dev_200.parquet
  prompt_template: |
    Translate the following Japanese to English. Output only the translation.

    Japanese: {jp}
    English:
  completion_field: en

train:
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 20
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3
  seed: 42

output:
  dir: backend/training/runs/manga-bubbles/qwen3_4b_sft
  wandb_project: manga-translator
  wandb_run_name: qwen3-4b-sft-v1

thinking_mode:
  disable: true  # rendered via enable_thinking=False + template-bake, NOT string replace

eval:
  l1_dev_size: 200
  l1_every_n_steps: 500
  probe_every_checkpoint: true
