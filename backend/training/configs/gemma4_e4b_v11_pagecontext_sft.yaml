model:
  # FROM BASE -it (not warm-started from v10it). Same base v10 used, so the
  # gemma-4-E4B-it-assistant MTP drafter stays compatible.
  name_or_path: unsloth/gemma-4-E4B-it
  dtype: bfloat16
  max_seq_length: 1024
  load_in_4bit: false
  full_finetuning: false

lora:
  # Proven v10 recipe — UNCHANGED.
  r: 16
  alpha: 32
  dropout: 0.0
  bias: none
  target_modules_regex: '^model\.language_model\.layers\.\d+\.(self_attn|mlp)\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$'
  expected_module_count: 258

data:
  # v11: context-augmented single-line (page context in, one bubble out) + plain
  # single-line. Schema [prompt, en, src, register_tag, gold_flag]; `prompt` is the
  # full user message, so the template is passthrough.
  train_path: backend/scripts/data/v11/data_v11_pagecontext.parquet
  eval_size: 1000
  prompt_user_template: "{prompt}"
  completion_field: en
  use_chat_template: true

train:
  # Proven v10 recipe — UNCHANGED.
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4   # eff batch = 16
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  weight_decay: 0.01
  bf16: true
  optim: adamw_8bit
  packing: false
  completion_only_loss: true
  logging_steps: 20
  save_steps_pct: 0.25
  eval_steps_pct: 0.05
  save_total_limit: 5
  seed: 42
  dataloader_num_workers: 4
  report_to: none

output:
  dir: backend/training/runs/manga-bubbles/gemma4_e4b_v11_pagecontext
  log_file: backend/training/runs/manga-bubbles/gemma4_e4b_v11_pagecontext/training.log

dry_run:
  enable: true
  fraction: 0.01
  max_steps: 100
