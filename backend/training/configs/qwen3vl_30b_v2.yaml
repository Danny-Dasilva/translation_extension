# v2 TEXT-ONLY TRAIN — abliterated Qwen3-VL-30B-A3B (MoE), vision frozen.
# Fork of the validated qwen3vl_8b_textsft_v1.yaml. Deltas vs v1:
#   - model.name_or_path -> the 30B-A3B abliterated base (bf16; NOT the AWQ serve pack)
#   - model.load_in_4bit: true  -> unsloth QLoRA (bitsandbytes NF4); MoE experts are
#     LoRA'd automatically (get_moe_target_parameters targets the fused
#     mlp.experts.{gate_up_proj,down_proj} nn.Parameters). Statically G0-verified.
#   - data.train_path -> data_v2_30b_messages.jsonl (86,137 rows = v13ship v1 + 24.9k
#     POV-contrastive; byte-exact v11 messages schema via build_v2_messages.py).
# PRECONDITIONS (do NOT launch until both hold):
#   1. validate_30b_g0.py prints GO on the box (experts adapted + text-only + masking band).
#   2. Box fsck/memtest cleared (synthesis 7.1) — a 30B QLoRA runs longer/hotter than any
#      8B run; corrupted checkpoint risk on the thermal-fault box. Cloud fallback if unsure.
# RUN (dedicated venv, from backend/):
#   /home/danny/venvs/qwen3vl_30b/bin/python scripts/train/sft_qwen3vl_8b_imagectx.py \
#     --config training/configs/qwen3vl_30b_v2.yaml
model:
  name_or_path: huihui-ai/Huihui-Qwen3-VL-30B-A3B-Instruct-abliterated
  dtype: bfloat16
  max_seq_length: 2048
  load_in_4bit: true                       # QLoRA NF4 (v1 was false/bf16; 30B needs 4-bit to fit 32GB)
  full_finetuning: false
  max_pixels: 1048576
  min_pixels: 200704

lora:
  r: 16
  alpha: 32
  dropout: 0.0
  bias: none
  finetune_vision_layers: false          # TEXT-ONLY (serve-with-image is the runtime win, not train)
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true             # REQUIRED: routes get_moe_target_parameters onto the experts
  target_modules_regex_hint: '(language_model\.layers\.\d+\.(self_attn|mlp)\.)'

data:
  train_path: /home/danny/ship_v2/data_v2_30b_messages.jsonl
  image_root: /home/danny/ship_v2
  eval_size: 64
  bucket_by_modality: false

train:
  num_train_epochs: 1
  per_device_train_batch_size: 1          # VRAM-tight at 30B; keep at 1
  gradient_accumulation_steps: 16         # eff batch 16 (matches v1)
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  weight_decay: 0.01
  bf16: true
  optim: adamw_8bit
  packing: false
  completion_only_loss: true              # INERT here (see trainer); masking owned by the collator
  logging_steps: 20
  save_steps_pct: 0.25                     # checkpoints for thermal-fault --resume
  eval_steps_pct: 0.25
  save_total_limit: 2
  seed: 42
  dataloader_num_workers: 4
  report_to: none
  in_training_eval: false                  # sm_120 in-training-eval SIGSEGVs
  resume_from_checkpoint: null

output:
  dir: /home/danny/ship_v2/out
  log_file: /home/danny/ship_v2/out/training.log

dry_run:
  enable: false
  fraction: 1.0
  max_steps: 0
