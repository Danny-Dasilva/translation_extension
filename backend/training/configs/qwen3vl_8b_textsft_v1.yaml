# v1 TEXT-ONLY SHIP TRAIN — abliterated Qwen3-VL-8B, vision frozen.
# Validate-first: v11 backbone (~65k) + Ikenie gold ×3, NO mined NSFW.
# Fork of the validated dry-run config (guard flip + --inspect/--dry-run green).
# Serve v1 via vLLM base + this LoRA adapter (--enable-lora); merge deferred to prod v2.
model:
  name_or_path: huihui-ai/Huihui-Qwen3-VL-8B-Instruct-abliterated
  dtype: bfloat16
  max_seq_length: 2048
  load_in_4bit: false
  full_finetuning: false
  max_pixels: 1048576
  min_pixels: 200704

lora:
  r: 16
  alpha: 32
  dropout: 0.0
  bias: none
  finetune_vision_layers: false          # TEXT-ONLY (validated: language_model=504, vision=0)
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true
  target_modules_regex_hint: '(language_model\.layers\.\d+\.(self_attn|mlp)\.)'

data:
  train_path: /home/danny/ship_v1/data_v13ship_v1_messages.jsonl
  image_root: /home/danny/ship_v1
  eval_size: 64
  bucket_by_modality: false

train:
  num_train_epochs: 1
  per_device_train_batch_size: 1          # VRAM-safe (dry-run confirmed batch 1 fits)
  gradient_accumulation_steps: 16         # eff batch 16
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  weight_decay: 0.01
  bf16: true
  optim: adamw_8bit
  packing: false
  completion_only_loss: true
  logging_steps: 20
  save_steps_pct: 0.25                     # checkpoints for thermal-fault --resume
  eval_steps_pct: 0.25
  save_total_limit: 2
  seed: 42
  dataloader_num_workers: 4
  report_to: none
  in_training_eval: false                  # sm_120 in-training-eval SIGSEGVs
  resume_from_checkpoint: null

output:
  dir: /home/danny/ship_v1/out
  log_file: /home/danny/ship_v1/out/training.log

dry_run:
  enable: false
  fraction: 1.0
  max_steps: 0
