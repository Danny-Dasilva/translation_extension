decisions:
  - language-aware nh mapping: en_gid only matches english-tagged nh, jp_gid only matches japanese-only (no bilingual). Eliminated 92% dup bug
  - full NxM LIS alignment over greedy window: handles JP-has-extras correctly (e.g. 100p EN vs 212p JP, 96 aligned)
  - strict classifier - good requires cov_max>=0.6 AND aligned>=8 AND aligned_avg<=20: kills same-artist-serial false positives
  - exhentai over hentairead - hentairead only serves 350px thumbs (unusable); exhentai full-res, has expunged content
  - ban-safety over speed - single-conn, 3s/page, 4k/day cap, hard-stop on ban/sad-panda/dead-cookie marker

findings:
