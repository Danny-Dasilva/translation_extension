findings:
  - dedup_pipeline_drift_confound: "THE session save. First v1 regen showed 33.2% empty translations vs baseline 3.9% -> probes 'regressed'. NOT the model: dedup_by_bubble ('1 balloon = 1 string', commit 6e9ab94 07-01 'batch dedup parity') blanks all-but-one EN per detected balloon BY DESIGN, and the 06-29 v11fix8_argocr baseline PREDATES it. Every direct replication of the 'empty' calls translated fine (sequential, concurrent, merged-ctx, normalize on/off). ALSO a real product bug: marked-line calls translate ONE line, so the blanked sibling's content is DROPPED from the rendered page (the balloon winner does NOT cover it) — same failure class as the documented translation_bubble_grouping disable note. Needs a fused-balloon-translate or resplit-redistribution fix."
  - mm_prefix_cache_works: "vLLM 0.22.1 on box: image KV cached after call 1, reused by all N marked calls (mm_cache 15/16 hits, prefix hits cover shared prefix, 0 garbled, conc-vs-seq mismatches are benign temp-0 batching paraphrases ~7-10% — though one flipped I/we, so batching noise can touch POV tokens). Warm calls ~110-220ms; cold call1 ~200-250ms quiet."
  - latency_reframe: "Old 1.4s baseline is stale (bench worktree); prod logs show 380-920ms steady-state. v1 8B translate via box: regen median 361ms/page text; with image ~0.5-0.7s/page wall-clock. Sub-1s E2E with 8B+image is REAL, not aspirational. Perceived <1s trivially via warm-prefix overlap + per-bubble streaming (geometry is final pre-translation; renderer has white-box fallback; SSE /events/{job_id} router exists but is DEAD CODE — unregistered in main.py; WS is the real substrate)."
  - normalize_off_required_for_v1: "build_v11_context_prompt with default short_utterance_normalize_enabled=True diverges from v1 training rows on 571/29467; OFF => 100% byte-match. v1 serving MUST set it false (pov_probe forces it; regen script exports it)."
  - eval_scorer_semantics: "probes.py check_pronoun_gender is absence-of-wrong (evasion scores as pass). probes.py REFUSAL_RE false-positives ('I can't wait!'); use v13ship build_textsft_refusalstripped.is_refusal (1/302k FP). Old POV results files are raw dumps — the old scorer never existed in git (.bench gitignored)."
  - deconfound_pending: "4B question unanswered but cheap: score is done for v11fix8 col (0%/1.9% gendered — brutal); zero-shot Huihui-Qwen3-VL-4B-abliterated (exists on HF) on the 148 set would settle size-vs-family-vs-image attribution. Recommended before funding any 8B-only path."

