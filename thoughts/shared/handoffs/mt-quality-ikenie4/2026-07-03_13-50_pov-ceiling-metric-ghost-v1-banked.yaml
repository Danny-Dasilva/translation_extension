      Flags are default-on; do the OUTSTANDING live in-browser test on real reader
      sites (prefetch hit-rate instrumentation), then consider it shipped. This is the
      banked +10.10-chrF win -- finish landing it.
  - id: 2
    title: "THE systemic balloon-fragmentation defect (detection-time grouping)"
    roi: HIGHEST
    effort: HIGH
    detail: >
      The REAL #1 quality bug all four pipeline-audit lenses converged on (synthesis
      2026-07-02 sec2). CTD emits one block per text COLUMN, so multi-column balloons
      get duplicated/blanked downstream. Fix = fuse side-by-side columns at DETECTION
      time (ctd_service.py:692-745 + bubble_grouping.py:114-156 geometry) so OCR sees
      one crop. Prior 06-29 attempt failed by retrofitting onto already-split OCR;
      detection-time is the correct fix. Validate via .bench/audit_3way_p1.py.
      Memory: project_p1_bubble_grouping_resplit.
  - id: 3
    title: "Retire the broken POV scorer; promote pov_probe_v2 into the cert gate"
    roi: MED
    effort: LOW
    detail: >
      pov_probe.py's gendered_rate is misleading (person/gender conflation). Swap the
      two-axis pov_probe_v2 into any gate/scorecard that used it, and build the
      one-command run_cert_gate.sh aggregating the 6 signals (still outstanding from
      the 07-02 handoff).
