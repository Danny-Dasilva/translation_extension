findings:
  - pov_metric_ghost: "0/67 real he<->she inversions in v1. 3 opposing-pronoun flags across 105 rows are ALL false positives (1 multi-referent where v1 is correct; 2 pro-drop no-cue). The 'ceiling' = person/register + 79% class-prior + artifacts. pov_probe_v2.py."
  - moe_quant_blocker: "bnb NF4 can't quantize fused MoE nn.Parameter experts (only nn.Linear). Any MoE VLM QLoRA on <=48GB is dead this way; dense models are fine."
  - image_signal_absent: "Image-as-context can't fix 3rd-person referent gender because the panel doesn't encode it. Vision LoRA attaches fine (216 modules); the signal, not the method, is missing."
  - serve_merged_for_vision: "vLLM LoRA can silently drop vision-tower modules; serve MERGED weights for any image-context model. Also merged-preprocessor size.longest_edge defaulted to 16777216 vs training 1048576 (2x res -> degenerate repetition)."

worked:
  - "Parallel research fan-out (4 disjoint-angle agents) surfaced the metric-ghost finding that 6 prior turns of training had missed -- the DATA/EVAL-diagnosis agent was the load-bearing one."
  - "Two-arm control (image-on vs image-off) + format-match verification made the negative results TRUSTWORTHY instead of confounded. The eval agent rebuilt an in-format harness rather than trusting the mismatched pov_probe."
  - "Dry-run/inspect gates before every multi-hour run (vision-LoRA attach check, mixed-batch collator, VRAM) caught issues cheaply; G0 caught the 30B blocker before a wasted 6-12h."

failed:
  - "Two sub-agents returned corrupted/garbage output (0 tool uses, injection-style text) -- re-verified those tasks by driving directly. Don't trust an agent result with 0 tool_uses."
  - "6+ turns chasing the POV ceiling before questioning the metric. LESSON: when repeated well-run experiments all fail the SAME way, suspect the measurement before the method."

