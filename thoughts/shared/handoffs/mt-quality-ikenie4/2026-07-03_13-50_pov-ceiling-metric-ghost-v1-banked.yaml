why_the_dead_ends_dont_work:
  - option: "30B-A3B QLoRA (was the funded v2 base)"
    verdict: "IMPOSSIBLE on <=48GB GPUs — not just tight, architecturally blocked."
    why: >
      bitsandbytes NF4 cannot quantize Qwen3VLMoeTextExperts' FUSED 3-D nn.Parameter
      experts (gate_up_proj/down_proj). transformers 5.12 replace_with_bnb_linear only
      swaps nn.Linear->Linear4bit, so 0/60 experts quantize; 28.99B expert params stay
      bf16 = 54GB; base loads ~57-59GB, OOMs at ~32% on the 32GB 5090. device_map=
      sequential+cpu-offload avoids the OOM (21GB peak) but only by CPU-offloading the
      bf16 experts -> unusably slow + a bnb meta-tensor bug. Corrects the earlier
      'static G0 green' (that confirmed LoRA can TARGET experts, missed that the frozen
      base experts can't be QUANTIZED). Needs A100/H100-80GB. Commit 3a0ad57; G0 in
      validate_30b_g0.py now emits a clean NO-GO. Plan: thoughts/shared/plans/2026-07-02_v2-30b-a3b-training-plan.md.
  - option: "Text-only POV-contrastive SFT (v2-8B, 24.9k mined POV rows)"
    verdict: "TRAINED (2.4h, loss 3.24->1.03) then DON'T-PROMOTE — regressed both axes."
    why: >
      Fair eval: chrF++ -3.08 vs v1 (CI95 [-4.85,-1.53] p=0 SIG) AND POV did not move
      (v2 <= v1 everywhere; v2+image COLLAPSED to 0% Furube). Applied preference
      pressure with NO new gender evidence -> the model guesses more confidently, not
      more correctly, plus a fluency tax. The mined rows were also wrong-distribution
      (clean named LN/VN prose vs nameless manga captions). Adapter + scorecards kept
      (box ~/ship_v2_8b/out/final; scripts/eval/scorecards/ikenie4/*v2_fair*). Memory:
      feedback_pov_contrastive_sft_regressed.
  - option: "Image-as-context LoRA (page image at train + inference; PBP-VIS-NUM)"
    verdict: "TRAINED both arms (image-on + image-off control) then DON'T-PROMOTE."
    why: >
      Clean two-arm control (image value = image-on - image-off) on held-out Furube:
      image value = +2.4pt POV but he<->she inversions FIXED = 0 (the decisive
      criterion). 21 evasion->pronoun gains vs 14 regressions (net +7/294, noisy). A
      manga panel rarely encodes a THIRD-PERSON referent's gender, so the image can't
      supply what's missing. Vision LoRA DID attach (vision_tower=216) and mixed
      image/text batches work -- the method is sound, the SIGNAL isn't there. Memory:
      feedback_image_context_poc_result. Adapters: box ~/merged_image{on,off} (17GB
      each -- USER: OK to delete to reclaim 34GB).
  - option: "ALL of the above (the meta-reason)"
    verdict: "They chased a failure that doesn't exist."
    why: >
      pov_probe_v2 proved v1's real he<->she inversion rate = 0. The 'ceiling' = person/
      register conflation (v1 renders monologue 'I' on 67.8% of 3rd-person NARRATION
      captions -- a rendering-style choice, not a gender error) + a 79% she-prior + ~24
      junk rows. No model/data/method lever can improve a metric measuring the wrong
      thing. Memory: feedback_pov_metric_is_broken.

ten_potential_next_steps:
  - id: 1
    title: "Fully ship v1 (close the rollout loop)"
    roi: HIGH
