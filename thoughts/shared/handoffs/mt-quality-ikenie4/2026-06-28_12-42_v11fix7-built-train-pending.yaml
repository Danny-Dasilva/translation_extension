decisions:
  - qwen3vl_gold_is_the_upgrade: Qwen3-VL-8B beats Qwen2.5-VL-7B on OCR+grounding (OCRBench 905 vs 864, native bbox); served FP8 LOCALLY (bf16 wouldn't fit alongside the videonest co-tenant; FP8 near-lossless, validated IoU 0.94). Box freed for Ornith mid-session.
  - dont_tighten_garble_gate: confidence does NOT predict translation quality (chrF flat across bands) and garble carries falsely-high conf, so any tighten regresses real dialogue. The gate is already conservative/well-tuned.
  - v11fix7_from_gold_not_nas: the NAS corpus needs a multi-day build; the Qwen3-VL gold (ch4+ch5) + the already-on-disk-but-untrained slices ARE the ready Phase-1 data.
