decisions:
  - bf16_is_production: "Both INT4 quants degrade v11fix8 below bf16's +3.0 (RTN/GPTQ erase the fine corrective fine-tuning; reverse_sense/name_invention regress). bf16 fits local at util 0.55 alongside videonest (29GB<32GB)."
  - chrf_eval_confounded_by_segmentation: "P1 changes bubble segmentation -> per-bubble bbox-gold join breaks -> chrF can't fairly measure the structural fix. Use omission/dup counts + visual render instead."
  - disable_p1_keep_p2p3: "P1 over-merges (regression); ship the safe wins (P2 dedup+backfill, P3 post-edit) which improve without the explosion."

findings:
  - int4_erases_corrective: "INT4 (RTN & GPTQ) regress EXACTLY the corrective probes (reverse_sense, name_invention) v11fix7/fix8 were trained to add. GPTQ used the v11 calib (not v11fix8) -> optimized toward v11 behavior."
  - over_segmentation_is_root: "One detection defect (multi-column balloon split per-column) drives omissions + repeated-text + render clutter. The high-leverage fix (column->parent-bubble merge) is real but the impl over-merges."
  - benchmark_gold_noisy: "Auto Qwen3-VL gold on unseen scanlation is noisy (untranslated-JP afterwords score 0, VLM merges bubbles, OCR garble on dense pages). Absolute chrF is a deflated floor; dialogue quality is 60-100."

