decisions:
  - crash_is_HARDWARE_power_not_code_or_load: UPDATED after a 2nd captured crash. The machine hard-crashes with NO software signature (no Xid/NVRM, no MCE [rasdaemon clean], no panic, no thermal — journal just stops mid-line = instant power loss). ~10 crashes today. The latest crash happened while the GPU was IDLE (30W, 37C, 4% util, cap at 400W active, 26min in) — which RULES OUT model code AND GPU-load/thermal as the trigger. The 400W cap DELAYS crashes (26min vs 2-5min) but does NOT prevent them. Conclusion: intermittent power-delivery hardware fault. Most likely the RTX 5090 12VHPWR/12V-2x6 connector not fully seated (the #1 '5090 instantly powers off PC, no logs' cause), or a marginal/failing PSU (needs 1000W+), or daisy-chained PCIe cables. USER MUST physically reseat the 12VHPWR connector + verify PSU. Software (power cap) only mitigates. Telemetry/journal forensics in runs/crash_telemetry/ + journalctl --list-boots.
  - hybrid_ocr_OFF: kept disabled (HYBRID_OCR_ENABLED=false) for VRAM/latency under co-location; the garbled OCR user saw was a CHINESE manga (model/OCR are fine on Japanese), not a quality bug.
  - onnx_arena_cap_6GB: backend ONNX arena ballooned to 17GB over hundreds of reqs (ORT_ARENA_KSAME alone doesn't cap total) → filled GPU → cuBLAS OOM → 0 boxes. Fixed w/ ORT_GPU_MEM_LIMIT_BYTES=6442450944. (2GB was too small earlier — detector needs ~1.15GB single alloc.)
  - firefox_android_only: Chrome Android can't load extensions; Firefox 152 can via `web-ext run -t firefox-android` (temporary add-on).

findings:
  - gallery_flood_is_the_oom_root_cause: The backend OCR-arena OOM is TRIGGERED by the extension. On a GALLERY page (nhentai /g/<id>/ thumbnail grid) the extension detects EVERY thumbnail (>100x100px filter) and queues them ALL -> burst of concurrent /translate -> arena exhaustion. REAL FIX = extension translates only ONE image per page (the main/largest content image; skip thumbnails). This was the user's last request, NOT YET IMPLEMENTED. Do this in image-detector.ts/content-script.ts (select single largest visible image by area, or require a min size + only-largest). Fixes the OOM at the source; backend MAX_PARALLEL_IMAGES=1 is just a band-aid.
  - backend_ocr_concurrency_oom: RAPID page-flip on phone sends a BURST of concurrent images -> concurrent ONNX detector/OCR runs exhaust GPU arena -> 'BFCArena Available memory X < requested Y' OOM -> 0 boxes. Mitigated (not solved) by MAX_PARALLEL_IMAGES=1 (was 4) + ORT_GPU_MEM_LIMIT_BYTES=6GB: burst of 6 -> 5/6 succeed (was ~all failing). REAL FIX options for next session: lower vLLM GPU_UTIL 0.40->0.35 to free backend headroom, OR move detector+OCR to CPUExecutionProvider (frees all backend GPU, slower), OR single shared ONNX arena budget. The 6GB cap is PER-SESSION not total (detector+ocr+bubble each get one) so backend can still hit ~12GB.
  - web_ext_quirks: deploy needs `adb shell am force-stop org.mozilla.firefox` first (clears dup RDP sockets), screen awake, and NO --no-reload (it makes web-ext install-and-exit). web-ext exits after install regardless (unsettled-await bug) but the temp add-on persists until Firefox restart. NOT permanent — needs AMO signing for that.
  - crash_telemetry_setup: runs/crash_telemetry/ has persistent dmon + sys loggers (survive reboot) — re-use to catch any future crash.
  - phone_tailscale_ip: phone=100.66.219.106, host=100.91.164.64; phone reaches backend over Tailscale fine.

