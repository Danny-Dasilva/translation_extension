decisions:
  - skip_mtp_drafter_training: poor ROI for our throughput (24-48h compute vs 1.5x speedup); revisit only if production volume justifies
  - deploy_via_llama_cpp_not_vllm: vLLM Gemma 4 LoRA load is silently broken (issue #41754); llama.cpp `--lora adapter.gguf` path works today
  - fix_merge_via_plain_peft: Unsloth's save_pretrained_merged corrupts Gemma 4 weights — bypass entirely with HF+PEFT merge_and_unload on CPU (vision/audio towers untouched since LoRA targets only language_model.*.{q,k,v,o,gate,up,down}_proj)
  - v10_path_b: 1 epoch on 276k (v7.1 + 132k Manga109Dialog) — highest EV per published wisdom, +5-10% Gemma exact-match expected

findings:
  - v9c_plateau_root_cause: Both v7 (Qwen3-4B) and v9c (Gemma 4 E4B) hit train_loss 0.14 = both saturated against same reference distribution. SFT cross-entropy caps at reference quality regardless of base model strength. Adding data > more epochs.
  - register_skew: Current 144k v7.1 mix is 65% non-manga (VN eroge 24%, novel 21%, vn 20%) — Manga109Dialog (132k contemporary manga bubbles) directly fills the missing register.
  - unsloth_clippable_linear_bug: Gemma 4 wraps vision/audio projections in Gemma4ClippableLinear (nn.Module not nn.Linear). PEFT's isinstance check fails → LoRA merges into wrong attribute → output garbage (TeX/Cyrillic/Korean). Fix landed on Unsloth main, not yet on PyPI.
  - llama_cpp_lora_works: convert_lora_to_gguf.py + `llama-server --lora adapter.gguf -m gemma-4-E4B-it.Q4_K_M.gguf` is the shortest deploy path today.
  - vllm_lora_broken: vLLM 0.20.0 loads Gemma 4 LoRA but silently no-ops (issue #41754, #39246 still open). FlashInfer needed on Blackwell sm_120. Don't go this route until fixed.
  - mtp_pt_it_mismatch: gemma-4-E4B-it-assistant drafter targets -IT logits; pairing with -pt-trained LoRA drops 41→25 tok/s (-38%) and 0.2% acceptance.

