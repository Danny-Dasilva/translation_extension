questions:
  - Which backlog tier to pick up first — the ~45-LOC observed-failure fixes (R6-2, R7-1, master #7, master #8) or the ~270-LOC top-3 quality chain (font_detector regression, LaMa window merge, per-bubble ID mask)?

decisions:
  - single_reusable_visualizer: Consolidated 41 per-round scripts into one CLI (visualize_e2e_pipeline.py) accepting explicit image paths + --out, --final-only, --skip-features
  - research_saturation: Round 9 formally declared saturation (0 novel findings after 7 corners audited); stop research rounds, implement from frozen 28-item backlog
  - cleared_historical_gallery: All historical per-page gallery dirs removed; pipeline-e2e/ is empty except for SUMMARY.md (a how-to-run reference) — ready to accept any user-provided filepath
  - composite_font_choice: Anton (narration/dialogue) + Bangers (short SFX/exclamations) via heuristic pick_font() — mirrors koharu's named_font selection w/o a prediction model
  - binary_fit_range: [6, 96] px with koharu's line_height = max(ascent+descent+leading, font_size) — exact port of layout.rs:133-186

findings:
  - inpaint_is_cpu_bottleneck: Gallery baseline 11.4s p50 / 55s p95 per page for LaMa on CPU; GPU (once onnxruntime-gpu reinstated) expected 10-30x faster. R6-1 pad_mod=8 + native-res small crops is the highest-ROI inpaint speedup.
  - raw_jp_fallback_rate_16pct: Across 163 images sampled, ~16% of pages had the batched LLM return raw Japanese instead of English — consistent production bug, addressed by master #7 (repeat_penalty=1.2 + streaming trim) + master #11 (per-image warning recovery).
  - zero_detect_rate_5pct: CTD threshold 0.3 misses pages with large display text (e.g. ドールズ cover). Koharu uses 0.235 binary / 0.35 NMS — master #8, 30 LOC fix validated by animetext_1104718.
  - font_detector_regression_unused: Our pipeline ignores regression[4-9] outputs (stroke_width_px, stroke_color, line_height, angle_deg) that the model already emits. Zero inference cost to thread through overlay-renderer — round-3 #1+#2+#10 (consolidated to master #1).
  - saturation_curve: Novel-items-per-round dropped 10→10→9→0+5→3→3→2→0 across 9 oracle rounds; clean geometric decay confirming research is done.

worked:
  - 10_parallel_worktree_launch: Spawned 10 kraken agents in parallel worktrees for rounds 1-2 — each agent owned 1-2 files, minimal merge conflicts
  - wip_commit_before_branching: Committing dirty working tree as 'WIP' baseline let all 10 worktrees branch from a consistent known state
  - oracle_strict_novelty_check: Rounds 6-9 explicitly told oracle "zero novel items is preferred over padding" — produced genuinely useful new findings in 6/7/8, clean saturation in 9
  - koharu_file_line_citations: Every backlog entry has concrete file:line refs in /tmp/koharu — easy to reconfirm or port

failed:
  - embedded_git_repo_warning: training/comic-text-detector is its own git repo inside the main repo; shows up as a submodule warning on every git add. Not broken but noisy.
  - cpu_only_inference: onnxruntime-gpu wheel was shadowed by the cpu wheel in the venv — 'uv pip uninstall onnxruntime && uv pip install --force-reinstall onnxruntime-gpu==1.23.2' needed once to reclaim GPU path

next:
  - Implement the 4 observed-failure quick wins in order of LOC/impact — R6-2 (10 LOC uppercase-Latin), R7-1 (4 LOC CTD vertical-merge threshold), master #7 (15 LOC LLM repeat_penalty), master #8 (30 LOC CTD threshold alignment). Total ~60 LOC fixes every observed failure.
  - Then master #1 (~40 LOC font_detector regression outputs) + R6-1 (~110 LOC LaMa pad_mod=8 + unmasked restore) for the biggest visible-quality jump.
  - Run visualize_e2e_pipeline.py on user-supplied test manga to confirm each change produces visible improvement.
  - Reinstate onnxruntime-gpu wheel to drop per-page latency from tens of seconds to seconds.
  - Consider a history rewrite (git-filter-repo) to reclaim the ~700 MB of old gallery blobs in .git — separate destructive op, not automatic.

