  - optimum only used by non-default manga-ocr (lazy import); PARSeq default needs only raw onnxruntime-gpu
  - Pipeline was CPU-bound on OCR+inpaint (96pct), not LLM (translate ~1pct/0.2s) - GPU-LaMa fixed inpaint; OCR now largest remaining stage
