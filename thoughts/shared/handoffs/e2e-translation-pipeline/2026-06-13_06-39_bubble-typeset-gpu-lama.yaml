decisions:
  - GPU_UTIL=0.60 for vLLM serve - 0.45 too low (15GB model won't fit), 0.70 starved ONNX vision (OOM); 0.60 leaves ~7GB for CTD/PARSeq/LaMa at page-concurrency 1
  - page-concurrency 1 (not 3) - concurrency 3 OOMs (3x ONNX CUDA sessions vs vLLM); GPU-LaMa made pages ~1-3s so serial is fine
  - Bubble-fit over blind-widening - CTD blocks are tight text regions; widening narrow vertical-JP columns overlaps neighbors. YOLOv10n bubble detector gives disjoint bubble rects; dedup 1 block/bubble
  - EAGLE-3 drafter rejected - 4-9pct runtime acceptance vs MTP 29pct despite 0.55 training acc; SpecForge->vLLM loading-path gap, not corpus. Production stays Google MTP gamma=2
  - Custom EAGLE-3 retrain v2 (production-prompt corpus) also failed - confirms loading-path issue, not prompt format

findings:
