mtp_decision_tree:
  question: -pt warm-start vs -it fresh re-base?
  option_A:
    name: Re-base v10 on -it (fresh train)
    cost: 5-7h training, lose v9c warm-start
    benefit: official google/gemma-4-E4B-it-assistant drafter works (~3x speedup, zero training cost)
    deploy: vLLM gemma4-0505-cu130 Docker, MTP enabled
  option_B:
    name: Stay on v9c -pt + train custom EAGLE-3 drafter
    cost: 24-36h via SpecForge offline mode, ~600GB hidden-state cache
    benefit: ~1.7-2.4x speedup (matches user's "I want MTP for speed" ask), preserves v9c warm-start
    deploy: vLLM with custom drafter
  option_C:
    name: Dual-base experiment (v10-pt warm-start + v10-it fresh)
    cost: 10-14h training, ship whichever wins quality eval
    benefit: empirical de-risking
  recommendation: A (cheapest path to user's speed ask, simplest production)
    fallback: if -it underperforms -pt by &gt;1.5pp on Gemma exact-match, switch to B

cpo_chain_v10_5:
  trigger: ship after v10 SFT, not as separate v11
  rationale: ALMA-R recipe broke SFT ceiling on translation with only 22k triplets; same bottleneck as v9c
  loss: CPO-SimPO joint (TRL CPOTrainer with loss_type="simpo", cpo_alpha=1.0, simpo_gamma=0.5, beta=2.0)
  triplet_construction:
    - per source: gold + Gemma 31B teacher + v9c on-policy×2
    - score with: XCOMET-XL + COMET-Kiwi-XL averaged
    - chosen=argmax, rejected=argmin, drop pair if margin &lt;0.05 or length-ratio extreme
    - target: 25-35k filtered pairs from 132k Manga109 pool
  hyperparams:
    learning_rate: 1e-6
    num_train_epochs: 1
    per_device_batch: 2
    grad_accum: 32  # effective 64
    warmup_ratio: 0.05
    weight_decay: 0.0
    max_length: 768
    max_prompt_length: 384
    attn_implementation: sdpa  # required on Blackwell sm_120 for Gemma 4 hybrid attention
  expected_lift: +4-7pp on Gemma exact-match, +0.02-0.04 XCOMET-XL absolute
  reference_model_required: false  # CPO is reference-free — main practical advantage

inference_engine_recommendation:
  primary: vLLM gemma4-0505-cu130 preview Docker
  rationale:
    - Contains PR #41745 (Google's official Gemma 4 MTP support)
    - Contains per-layer attention backend fix (#38887) — without this E4B runs at 9 tok/s on Triton fallback
    - LoRA must be merged first (#41754: vLLM Gemma 4 LoRA silently no-ops) — done via merge_gemma4_lora_clean.py
    - CRITICAL: drafter must pair with -it target, NOT -pt (#41789: 0.2% accept rate when mismatched)
  expected_throughput:
    e4b_vllm_no_mtp: ~150-200 tok/s decode on RTX 5090
    e4b_vllm_with_mtp: ~250-380 tok/s decode (1.7-2.2x consistent gain)
  fallback: llama.cpp (vanilla draft model only, no EAGLE/MTP for Gemma 4 yet)
  avoid: SGLang (requires forks for Gemma 4 EAGLE3), MLC-LLM (no Gemma 4), TRT-LLM (consumer Blackwell gaps)

eval_gates_v10:
  primary: 5-metric Pareto (≥3 of 5 must improve over v9c)
    - Gemma exact-match: ≥36% (softened from prior 38% — +4.9pp absolute is upper-end of plausible)
    - chrF++: +1.5 absolute
    - COMET-22: +0.015 absolute
    - COMET-Kiwi-23: +0.015 absolute
    - short-bubble (≤8 chars) accuracy: +2%
  per_bubble_logging: yes (track failure modes by length, register, character type)
  harness: existing 3-way HTML (v7 vs v9c vs v10) + add v10.5 column post-CPO

failure_mode_fallbacks:
  v10_regresses_below_v9c: roll back, restart fresh on -it instead of warm-start
  pareto_fails_under_3of5: skip v10 SFT, run CPO directly on v9c → ship as v10.5
  manga109_teacher_too_noisy: subset top-50% by COMET-Kiwi, halve to 66k
  gguf_conversion_breaks: vLLM-only deploy at lower throughput (no MTP)
  both_pt_and_it_underperform: data ceiling confirmed — pivot v11 to human-annotated 5-10k Manga109 subset

