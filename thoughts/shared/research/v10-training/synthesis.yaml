goal: Lock v10 training plan after re-running rate-limited agents and adding MTP-focused research per user request.

corrections_to_handoff_2026-05-07_09-10:
  - issue: Handoff claimed v9c LoRA "targets only language_model.*.{q,k,v,o,gate,up,down}_proj — vision/audio towers untouched"
    reality: v9c adapter targets 406 modules — 258 language_model (bare nn.Linear) + 112 vision_tower + 36 audio_tower (both inside Gemma4ClippableLinear)
    impact: PEFT's merge_and_unload REJECTS the adapter outright with "Target module Gemma4ClippableLinear is not supported" — never even gets to merge. The "plain HF+PEFT" workaround in the handoff would have failed.
    actual_fix: bypass PEFT entirely; manual safetensors state-dict fold (target += B@A * alpha/r). Implemented at backend/scripts/eval/merge_gemma4_lora_clean.py — verification PASSED 5/5 prompts.
  - issue: Handoff said base model is google/gemma-4-E4B-pt
    reality: base is unsloth/gemma-4-E4B (no -pt suffix; google variant doesn't exist on HF Hub)
  - issue: Handoff recommended deploy via llama.cpp + LoRA-as-GGUF
    reality: llama.cpp does NOT support EAGLE-3 or MTP for Gemma 4 (only vanilla draft model). vLLM gemma4-0505-cu130 preview Docker has Google's MTP fix (PR #41745) and per-layer attention backend fix (#38887). Recommended: vLLM, not llama.cpp, for production deploy.
  - issue: Handoff said adapter has lora_dropout=0
    reality: actual lora_dropout=0.05

locked_v10_hyperparams:
  base_model: unsloth/gemma-4-E4B (continue from v9c adapter)
  init: warm-start from backend/training/runs/manga-bubbles/gemma4_e4b_v9c/final/
  lora_r: 16  # cannot raise mid-continuation; defer to v11 post-merge
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: same as v9c (q,k,v,o,gate,up,down × language_model + projection.linear × vision/audio)
  learning_rate: 5e-5  # halved from v9c's 1e-4 for continuation stability
  lr_scheduler: cosine
  warmup_ratio: 0.01  # down from v9c's 0.03
  num_train_epochs: 1  # at train_loss 0.14 already overfit; more epochs = regression risk
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4  # effective batch = 16 (LoRA Without Regret cap is &lt;32)
  max_seq_length: 1024
  packing: false
  completion_only_loss: true  # NEW for v10 — Shi et al. 2024 +0.5-2pp EM on short completions
  neftune_noise_alpha: null
  max_grad_norm: 1.0
  bf16: true  # requires torch ≥2.11 for sm_120
  optim: adamw_8bit
  weight_decay: 0.01
  data_ordering: random_shuffle  # not curriculum, not domain-grouped

