questions:
  - Should Phase 2 training be resumed to completion before Phase 3?
  - What confidence threshold should be used for block detection training?

decisions:
  - nms_threshold_0.5: Standard NMS IoU threshold to remove duplicate boxes while preserving distinct detections
  - conf_thresh_0.25: Low confidence threshold to capture more potential text blocks during annotation

findings:
  - original_model_outputs: |
      blk: (1, 64512, 7) - Block/bubble detections (anchor-based)
      seg: (1, 1, 1024, 1024) - Segmentation mask
      det: (1, 2, 1024, 1024) - DBNet text line detection
  - annotation_format: |
      JSON with text_blocks array, each having bbox [x1,y1,x2,y2] and confidence
      Plus original_size [width, height] for scaling
  - nms_impact: Reduced boxes from 163+ overlapping to ~10-15 clean boxes per image

